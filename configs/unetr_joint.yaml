# configs/unetr_joint.yaml
# Phase 3: Joint fine-tune — backbone unfrozen, coord + seg together

run:
  name: unetr_joint
  seed: 42

data:
  train_dir: /workspace/rezonans/dataset/train_set
  val_split: 0.2
  crop_size: 128
  jitter: 32
  normalize: true
  preload: true
  cache_dir: /workspace/rezonans/cache

model:
  name: ttfields_unetr
  in_channels: 4
  out_channels: 4
  img_size: 128
  feature_size: 32
  hidden_size: 768
  mlp_dim: 3072
  num_heads: 12
  dropout_rate: 0.0
  use_coord_head: true

training:
  mode: multitask
  pretrained: /workspace/rezonans/checkpoints/unetr_coord/best.pt
  freeze_backbone: false
  monitor_metric: val_coord_wt_mae_norm
  device: cuda
  batch_size: 32
  num_workers: 16
  max_epochs: 50
  lr: 0.00005
  lr_min: 0.000001
  weight_decay: 0.00001
  precision: fp16
  log_interval: 1
  scheduler: cosine
  checkpoint_dir: /workspace/rezonans/checkpoints/unetr_joint

loss:
  dice: 1.0
  ce: 1.0
  focal: 0.0
  coord: 0.1
  et_coord: 0.5
  coord_warmup_epoch: 0
  coord_rampup_epoch: 0
  lambda_coord_max: 0.5
