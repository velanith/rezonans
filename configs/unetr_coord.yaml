# configs/unetr_coord.yaml
# Phase 2: CoordinateHead training with frozen UNETR backbone

run:
  name: unetr_coord
  seed: 42

data:
  train_dir: /workspace/rezonans/dataset/train_set
  val_split: 0.2
  crop_size: 128
  jitter: 32
  normalize: true
  preload: true
  cache_dir: /workspace/rezonans/cache

model:
  name: ttfields_unetr
  in_channels: 4
  out_channels: 4
  img_size: 128
  feature_size: 32
  hidden_size: 768
  mlp_dim: 3072
  num_heads: 12
  dropout_rate: 0.0
  use_coord_head: true

training:
  mode: multitask
  pretrained: /workspace/rezonans/checkpoints/unetr_seg/best.pt
  freeze_backbone: true
  device: cuda
  batch_size: 64
  num_workers: 16
  max_epochs: 100
  lr: 0.004
  lr_min: 0.00004
  weight_decay: 0.00001
  precision: fp16
  log_interval: 1
  scheduler: cosine
  checkpoint_dir: /workspace/rezonans/checkpoints/unetr_coord

loss:
  dice: 1.0
  ce: 1.0
  focal: 0.0
  coord: 0.1
  et_coord: 0.5
  coord_warmup_epoch: 0
  coord_rampup_epoch: 20
  lambda_coord_max: 0.5
